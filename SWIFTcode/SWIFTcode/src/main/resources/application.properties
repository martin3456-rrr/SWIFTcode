# H2 Database Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.url=jdbc:h2:mem:swiftcodedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Configure the path to your SWIFT data file
swift.data.file=classpath:swift_codes.csv
spring.jvm.args=--add-opens java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED
# application.properties
spring.web.resources.add-mappings=false